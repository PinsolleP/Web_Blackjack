
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="table">

    <h1>♠ Blackjack ♥</h1>

    <section class="zone">
      <h2>Croupier</h2>

      <div id="cartesCroupier" class="cartes"></div>

      <p>Score : <span id="scoreCroupier">?</span></p>
    </section>


    <section class="message">
      <p id="resultat"></p>
    </section>

    <section class="zone">
      <h2>Joueur</h2>

      <div id="carte" class="cartes"></div>

      <p>Score : <span id="score">0</span></p>
    </section>


    <section class="actions"></section>
      <button id="tirer">Tirer</button>
      <button id="rester">Rester</button>
      <button id="nouvellePartie">Nouvelle partie</button>
    </section>
  
  </main>

  <script src="script.js"></script>

</body>
</html>
